aid: kuraseru
name: Kuraseru
description: 'KURASERU, INC. (株式会社KURASERU) is a Kobe-based Japanese technology company
  building digital-transformation software for the elderly-care industry. Founded in
  October 2017 by Taiki Kawahara, a former care worker and hospital medical social worker,
  the company describes its business as DX promotion for care-related services and system
  development. Its stated mission is to use technology to lift the administrative burden
  off care work so that caregivers can spend more of their time with the people they care
  for, addressing Japan''s super-aging society, chronic caregiver shortages, and high
  turnover. KURASERU is ISO/IEC 27001 certified (IS 716039) and is backed by 500 Global.
  As of this enrichment pass the company publishes no public API, developer portal, SDKs,
  or documentation surface, so this is a company profile rather than an API profile.'
